name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Specific version to release (defaults to package.json version)"
        required: false
        type: string

permissions:
  contents: write

env:
  DOCKERHUB_USERNAME: chavda2772
  IMAGE_NAME: next-template

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi

          if [ -z "$VERSION" ]; then
            echo "Version not found in package.json or inputs"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Version Branch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" =~ ^v ]]; then
            BRANCH_NAME="$VERSION"
          else
            BRANCH_NAME="v$VERSION"
          fi

          echo "Creating and pushing version branch: $BRANCH_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git branch -f "$BRANCH_NAME"
          git push origin "$BRANCH_NAME" --force

      - name: Build Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" =~ ^v ]]; then
            BRANCH_NAME="$VERSION"
          else
            BRANCH_NAME="v$VERSION"
          fi
          echo "## Docker Image Published & Version Branch Created 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Version: \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch created: \`$BRANCH_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- Version tag: \`${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- Latest tag: \`${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
